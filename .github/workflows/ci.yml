name: CI

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe syntax
        run: python -m py_compile tools/probe/probe.py
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:model:test :core:data:testDebugUnitTest :app:lintDebug :app:assembleDebug
